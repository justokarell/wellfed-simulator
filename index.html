<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>WellFed · Tax Savings Simulator</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#0F1A14;color:#E8F0E4;font-size:14px;min-height:100vh}
.header{border-bottom:1px solid #2A3D22;padding:16px 24px;display:flex;align-items:baseline;gap:10px}
.logo{font-size:18px;font-weight:700;color:#6EE77A}
.logo-sub{font-size:12px;color:#8FAB87}
.wrap{display:grid;grid-template-columns:280px 1fr;min-height:calc(100vh - 53px)}
.side{background:#172010;border-right:1px solid #2A3D22;padding:20px 16px;overflow-y:auto}
.main{padding:24px;overflow-y:auto}
.sec{font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:#4A6642;margin:20px 0 8px}
.sec:first-child{margin-top:0}
label{font-size:11px;color:#8FAB87;display:block;margin-bottom:4px}
select{width:100%;font-size:12px;padding:7px 9px;border-radius:6px;border:1px solid #2A3D22;background:#1D2A18;color:#E8F0E4;font-family:'Inter',sans-serif;cursor:pointer;margin-bottom:10px}
.sl-row{display:flex;justify-content:space-between;margin-bottom:3px}
.sl-val{font-size:12px;font-weight:600;color:#6EE77A}
input[type=range]{width:100%;accent-color:#6EE77A;cursor:pointer;margin-bottom:10px}
.rb-row{display:flex;gap:6px;margin-bottom:10px}
.rb{flex:1;padding:7px 0;text-align:center;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid #2A3D22;background:#1D2A18;color:#8FAB87;transition:all .15s;user-select:none}
.rb.on{border-color:#6EE77A;background:#1A3020;color:#6EE77A}
.dinfo{font-size:11px;color:#8FAB87;line-height:1.7;margin-bottom:4px}
.dist-badge{display:inline-block;font-size:11px;background:#1A3020;color:#6EE77A;padding:2px 8px;border-radius:4px;margin-top:4px}
.empty{text-align:center;padding:60px 20px;color:#4A6642;font-size:13px}
.verdict{border-radius:8px;padding:14px 16px;margin-bottom:16px;display:flex;align-items:center;gap:12px}
.v-ok{background:linear-gradient(135deg,#1A3020,#1D3822);border:1px solid #6EE77A}
.v-no{background:linear-gradient(135deg,#2A1818,#301A1A);border:1px solid #F07070}
.v-title{font-size:15px;font-weight:600}
.v-ok .v-title{color:#6EE77A}
.v-no .v-title{color:#F07070}
.v-sub{font-size:11px;color:#8FAB87;margin-top:3px}
.v-bracket{margin-left:auto;text-align:right;flex-shrink:0}
.v-bracket-lbl{font-size:10px;color:#4A6642}
.v-bracket-val{font-size:20px;font-weight:700;color:#6EE77A}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.mc{background:#1D2A18;border:1px solid #2A3D22;border-radius:8px;padding:12px 14px}
.ml{font-size:10px;color:#4A6642;margin-bottom:4px}
.mv{font-size:20px;font-weight:700}
.mv-ok{color:#6EE77A}
.mv-no{color:#F07070}
.mv-neu{color:#E8F0E4}
.ann{background:#1A2E1C;border:1px solid #2A4A2C;border-radius:8px;padding:14px 16px;display:flex;align-items:center;gap:12px}
.ann-text{font-size:12px;color:#8FAB87;flex:1}
.ann-val{font-size:24px;font-weight:700;color:#6EE77A;flex-shrink:0}
.disc{font-size:10px;color:#4A6642;margin-top:16px;border-top:1px solid #2A3D22;padding-top:12px;line-height:1.6}
@media(max-width:640px){
  .wrap{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .side{border-right:none;border-bottom:1px solid #2A3D22}
  .metrics{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div class="header">
  <span class="logo">WellFed</span>
  <span class="logo-sub">Food Donation Tax Savings Simulator · Upper West Side, NYC</span>
</div>
<div class="wrap">
  <div class="side">
    <div class="sec">Donor Business</div>
    <label>Select your business</label>
    <select id="dSel"></select>
    <div class="dinfo" id="dInfo"></div>
    <div class="sec">Nonprofit</div>
    <label>Select nonprofit</label>
    <select id="nSel"><option value="">— pick a nonprofit —</option></select>
    <div id="distBadge"></div>
    <div class="sec">Transportation</div>
    <label>Who makes the delivery?</label>
    <div class="rb-row">
      <div class="rb on" id="rbS" onclick="setT('self')">I deliver</div>
      <div class="rb" id="rbD" onclick="setT('driver')">Hire driver</div>
    </div>
    <div id="wageRow" style="display:none">
      <div class="sl-row"><label>Driver wage</label><span class="sl-val" id="wVal">$18/hr</span></div>
      <input type="range" id="wage" min="10" max="40" step="0.5" value="18" oninput="sl(this,'wVal',v=>`$${parseFloat(v).toFixed(0)}/hr`)">
    </div>
    <div class="sec">Income</div>
    <div class="sl-row"><label>Annual taxable income</label><span class="sl-val" id="iVal">$120,000</span></div>
    <input type="range" id="income" min="10000" max="700000" step="5000" value="120000" oninput="sl(this,'iVal',v=>`$${Math.round(v).toLocaleString()}`)">
    <div class="sec">Trip Costs</div>
    <div class="sl-row"><label>Gas price</label><span class="sl-val" id="gVal">$3.80/gal</span></div>
    <input type="range" id="gas" min="2" max="8" step="0.1" value="3.8" oninput="sl(this,'gVal',v=>`$${parseFloat(v).toFixed(2)}/gal`)">
    <div class="sl-row"><label>Vehicle MPG</label><span class="sl-val" id="mVal">25 mpg</span></div>
    <input type="range" id="mpg" min="10" max="60" step="1" value="25" oninput="sl(this,'mVal',v=>`${v} mpg`)">
    <div class="sl-row"><label>Avg speed</label><span class="sl-val" id="sVal">15 mph</span></div>
    <input type="range" id="spd" min="5" max="40" step="1" value="15" oninput="sl(this,'sVal',v=>`${v} mph`)">
    <div class="sl-row"><label>Container cost</label><span class="sl-val" id="cVal">$5.00</span></div>
    <input type="range" id="cont" min="0" max="20" step="0.5" value="5" oninput="sl(this,'cVal',v=>`$${parseFloat(v).toFixed(2)}`)">
  </div>
  <div class="main" id="main">
    <div class="empty">📍 Select a nonprofit from the dropdown to see your tax savings estimate.</div>
  </div>
</div>
<script>
const NPS=[
  {id:"wscah",name:"West Side Campaign Against Hunger",lat:40.7889,lon:-73.9750},
  {id:"ncjw",name:"National Council of Jewish Women",lat:40.7754,lon:-73.9800},
  {id:"stmike",name:"St. Michael's Church",lat:40.7804,lon:-73.9812},
  {id:"unitar",name:"Unitarian Church of All Souls",lat:40.7733,lon:-73.9579},
  {id:"parkav",name:"Park Avenue Synagogue",lat:40.7757,lon:-73.9583},
  {id:"stluke",name:"St. Luke's Food Pantry",lat:40.7978,lon:-73.9680},
];
const DONORS=[
  {id:"gin",name:"The Speakeasy at The Gin Mill",lat:40.7868,lon:-73.9807,cat:"Prepared Meals",units:22},
  {id:"blonde",name:"Blondies Sports",lat:40.7851,lon:-73.9793,cat:"Prepared Meals",units:20},
  {id:"buceo",name:"Buceo 95",lat:40.7924,lon:-73.9742,cat:"Prepared Meals",units:18},
  {id:"gebhard",name:"Gebhard's Beer Culture",lat:40.7907,lon:-73.9731,cat:"Beverages",units:25},
  {id:"carlyle",name:"Cafe Carlyle",lat:40.7739,lon:-73.9632,cat:"Prepared Meals",units:19},
  {id:"gennaro",name:"Gennaro Restaurant",lat:40.7877,lon:-73.9820,cat:"Prepared Meals",units:21},
  {id:"barney",name:"Barney Greengrass",lat:40.7852,lon:-73.9798,cat:"Dairy",units:14},
  {id:"belle",name:"Hotel Belleclaire Kitchen",lat:40.7861,lon:-73.9810,cat:"Prepared Meals",units:17},
  {id:"bellini",name:"Bellini",lat:40.7743,lon:-73.9820,cat:"Baked Goods",units:30},
  {id:"sabar",name:"Cafe Sabarsky",lat:40.7838,lon:-73.9589,cat:"Baked Goods",units:28},
  {id:"vbar",name:"V&T Restaurant",lat:40.8012,lon:-73.9660,cat:"Prepared Meals",units:16},
  {id:"amster",name:"Amsterdam Restaurant & Bar",lat:40.7905,lon:-73.9760,cat:"Fresh Produce",units:35},
  {id:"wave",name:"Wave Hill Bread",lat:40.7830,lon:-73.9820,cat:"Baked Goods",units:40},
  {id:"joe",name:"Joe Coffee UWS",lat:40.7843,lon:-73.9796,cat:"Beverages",units:18},
  {id:"ouest",name:"Ouest Restaurant",lat:40.7880,lon:-73.9832,cat:"Prepared Meals",units:23},
];
const PR={
  "Prepared Meals":{a:2.50,s:.60,C:4.50},
  "Baked Goods":{a:1.80,s:.50,C:1.80},
  "Fresh Produce":{a:.60,s:.40,C:1.20},
  "Dairy":{a:.90,s:.30,C:2.00},
  "Beverages":{a:3.50,s:.70,C:.80},
};
const BR=[[11600,.10],[47150,.12],[100525,.22],[191950,.24],[243725,.32],[609350,.35],[Infinity,.37]];
function mRate(v){for(const[c,r]of BR)if(v<=c)return r;return .37}
function npdf(x){return Math.exp(-.5*x*x)/Math.sqrt(2*Math.PI)}
function ncdf(x){const t=1/(1+.2316419*Math.abs(x));const p=t*(.31938+t*(-.35656+t*(1.78148+t*(-1.82126+t*1.33027))));return x>=0?1-npdf(x)*p:npdf(x)*p}
function edVal(a,C,sC){const s=Math.max(sC*C,1e-9),z=(2-a)*C/s,ph=npdf(z),Ph=ncdf(z),Et=Ph>1e-10?a*C+s*ph/Ph:a*C;return Math.min((C+.5*Et)*Ph+2*C*(1-Ph),2*C)}
function hav(a,b,c,d){const R=3958.8,dA=(c-a)*Math.PI/180,dO=(d-b)*Math.PI/180,x=Math.sin(dA/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dO/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))}
function tc(dist,gas,mpg,wage,spd,cont){return dist*(gas/mpg+wage/spd)+cont}
function gv(id){return parseFloat(document.getElementById(id).value)}
let D=DONORS[0],N=null,transport='self';
function sl(el,vid,fmt){document.getElementById(vid).textContent=fmt(el.value);compute()}
function setT(t){
  transport=t;
  document.getElementById('rbS').className='rb'+(t==='self'?' on':'');
  document.getElementById('rbD').className='rb'+(t==='driver'?' on':'');
  document.getElementById('wageRow').style.display=t==='driver'?'block':'none';
  compute();
}
function compute(){
  if(!N){document.getElementById('main').innerHTML='<div class="empty">Select a nonprofit from the dropdown to see your tax savings estimate.</div>';return}
  const p=PR[D.cat],ed=edVal(p.a,p.C,p.s),t=mRate(gv('income')),n=D.units;
  const gas=gv('gas'),mpg=gv('mpg'),spd=gv('spd'),cont=gv('cont'),wage=transport==='driver'?gv('wage'):0;
  const dist=hav(D.lat,D.lon,N.lat,N.lon),trip=tc(dist,gas,mpg,wage,spd,cont);
  const sav=t*ed*n,net=sav-trip,Vg=n*p.C,thr=p.C*trip/(t*ed),ok=Vg>=thr,ann=net*5*50,be=trip/(t*ed);
  document.getElementById('main').innerHTML=`
    <div class="verdict ${ok?'v-ok':'v-no'}">
      <div style="font-size:24px">${ok?'&#x2705;':'&#x274C;'}</div>
      <div>
        <div class="v-title">${ok?'Viable trip':'Below threshold'}</div>
        <div class="v-sub">${ok
          ?'$'+Vg.toFixed(2)+' donation clears the $'+thr.toFixed(2)+' threshold &nbsp;&middot;&nbsp; '+dist.toFixed(2)+' mi to '+N.name
          :'Need '+Math.ceil(be-n)+' more units to break even &nbsp;&middot;&nbsp; '+dist.toFixed(2)+' mi to '+N.name}</div>
      </div>
      <div class="v-bracket">
        <div class="v-bracket-lbl">Tax bracket</div>
        <div class="v-bracket-val">${(t*100).toFixed(0)}%</div>
      </div>
    </div>
    <div class="metrics">
      <div class="mc"><div class="ml">Tax savings / trip</div><div class="mv mv-ok">$${sav.toFixed(2)}</div></div>
      <div class="mc"><div class="ml">Net benefit / trip</div><div class="mv ${net>=0?'mv-ok':'mv-no'}">$${net.toFixed(2)}</div></div>
      <div class="mc"><div class="ml">Trip cost</div><div class="mv mv-neu">$${trip.toFixed(2)}</div></div>
      <div class="mc"><div class="ml">Donation value</div><div class="mv mv-neu">$${Vg.toFixed(2)}</div></div>
      <div class="mc"><div class="ml">Viability threshold</div><div class="mv mv-neu">$${thr.toFixed(2)}</div></div>
      <div class="mc"><div class="ml">Break-even units</div><div class="mv mv-neu">${be.toFixed(1)}</div></div>
    </div>
    <div class="ann">
      <div style="font-size:20px">&#x1F4C5;</div>
      <div class="ann-text">Donating 5 nights a week, 50 weeks a year, your estimated annual net tax benefit is</div>
      <div class="ann-val">${ann>=0?'$'+Math.round(ann).toLocaleString():'-$'+Math.round(Math.abs(ann)).toLocaleString()}</div>
    </div>
    <div class="disc">Tax savings realized only with positive taxable income and donation to a qualified 501(c)(3) under the PATH Act of 2015. Distances are straight-line haversine; urban routing distances are 20-40% longer.</div>`;
}
window.addEventListener('DOMContentLoaded',function(){
  var ds=document.getElementById('dSel');
  DONORS.forEach(function(d){var o=document.createElement('option');o.value=d.id;o.textContent=d.name;ds.appendChild(o)});
  ds.addEventListener('change',function(){
    D=DONORS.find(function(x){return x.id===ds.value});
    document.getElementById('dInfo').innerHTML='Category: '+D.cat+'<br>Units/shift: '+D.units+'<br>Cost/unit: $'+PR[D.cat].C.toFixed(2);
    N=null;document.getElementById('nSel').value='';document.getElementById('distBadge').innerHTML='';
    compute();
  });
  document.getElementById('dInfo').innerHTML='Category: '+D.cat+'<br>Units/shift: '+D.units+'<br>Cost/unit: $'+PR[D.cat].C.toFixed(2);
  var ns=document.getElementById('nSel');
  NPS.forEach(function(n){var o=document.createElement('option');o.value=n.id;o.textContent=n.name;ns.appendChild(o)});
  ns.addEventListener('change',function(){
    N=NPS.find(function(x){return x.id===ns.value})||null;
    document.getElementById('distBadge').innerHTML=N&&D?'<span class="dist-badge">'+hav(D.lat,D.lon,N.lat,N.lon).toFixed(2)+' mi away</span>':'';
    compute();
  });
});
</script>
</body>
</html>
